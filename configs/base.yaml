# Base configuration. Every machine- or model-specific value is a ${VAR}
# reference, so the repo itself contains no host, path, or model id.
project: frictiontune
seed: 0

paths:
  artifacts_dir: artifacts
  cache_dir: .cache/frictiontune
  corpus_db: ${FRICTIONTUNE_CORPUS_DB:-}
  base_weights_dir: ${FRICTIONTUNE_BASE_WEIGHTS:-}

embedding:
  provider: openai_compatible
  base_url: ${FRICTIONTUNE_EMBED_BASE_URL:-http://localhost:8000/v1}
  model: ${FRICTIONTUNE_EMBED_MODEL:-text-embedding-3-small}
  api_key_env: FRICTIONTUNE_EMBED_API_KEY
  dimensions:
  max_input_chars: ${FRICTIONTUNE_EMBED_MAX_INPUT_CHARS:-8000}
  cache: true
  timeout_s: 60.0

evaluation:
  # Leading edge of the time split: everything strictly older trains, the rest
  # evaluates. Never mix the two.
  #
  # 0.8 held out only the newest session, which the contamination tiers then
  # trimmed to 4-7 episodes — below the six that a paired sign test needs
  # before any 0.05-level claim is attainable (the p floor is 2·(1/2)^n). 0.6
  # holds out ~40% of the records so the floor is reachable; the cost is fewer
  # training records, which is the right trade while the instrument cannot
  # detect anything. At n>=6 the honest next move is to revisit this.
  time_split_quantile: 0.6
  t1_exact_ngram: true
  t2_syntactic: true
  t3_semantic: true
  t4_task_level: true
  ngram_size: 8
  seeds: [0, 1, 2]
  external_corpora: []
