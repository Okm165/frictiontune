[project]
name = "frictiontune"
version = "0.1.0"
description = "Data-centric pipeline: mine agent chat logs, detect friction, compile runtime rules, and build curated SFT data."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "frictiontune contributors" }]
keywords = ["llm", "agents", "fine-tuning", "swe", "data-centric", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: the data pipeline is deliberately light. Heavy training deps live in
# the sibling package `frictiontune-train` so this installs on a CPU log box.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typing-extensions>=4.12",
  "structlog>=24.1",
  "tenacity>=8.3",
  "httpx>=0.27",
  "openai>=1.40",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
tui = ["textual>=0.76"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
]

[project.scripts]
frictiontune = "frictiontune.cli:app"

[project.urls]
Homepage = "https://github.com/frictiontune/frictiontune"
Documentation = "https://github.com/frictiontune/frictiontune/blob/main/docs/architecture.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frictiontune"]