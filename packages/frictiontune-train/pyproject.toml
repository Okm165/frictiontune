[project]
name = "frictiontune-train"
version = "0.1.0"
description = "Training/GPU side of frictiontune: QLoRA SFT, RAFT/SRFT, GRPO, rollout sandbox, and adapter export."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "frictiontune contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "frictiontune",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Install with `uv sync --package frictiontune-train --extra train` on the GPU box.
train = [
  "torch>=2.3",
  "transformers>=4.43",
  "peft>=0.13",
  "trl>=0.12",
  "datasets>=2.20",
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
  "sentencepiece>=0.2",
]
grpo = [
  "torch>=2.3",
  "transformers>=4.43",
  "trl>=0.14",
  "accelerate>=0.33",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frictiontune_train"]

# Register the training stages into the shared pipeline registry.
[project.entry-points."frictiontune.plugins"]
train = "frictiontune_train.plugin"

[tool.uv.sources]
frictiontune = { workspace = true }